name = "brodx-backend"
main = "src/index.ts"
compatibility_date = "2024-03-25"
compatibility_flags = [ "nodejs_compat" ]

[vars]
FRONTEND_URL = "https://brodx.com"

# The following secrets should be set using 'wrangler secret put':
# DATABASE_URL
# RAZORPAY_KEY_ID
# RAZORPAY_KEY_SECRET
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# JWT_SECRET
# ADMIN_EMAIL
